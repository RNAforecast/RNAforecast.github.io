abstract:
  Whether RNA itself is the therapeutic molecule or the therapeutic target,
  design decisions are often made primarily at the sequence level. The RNA
  molecule, however, occupies a folding landscape that can change during
  synthesis, binding, modification, translation, and
  degradation. For RNA constructs, sequence changes can alter structural
  ensembles, accessibility and folding behaviour. For RNA targets, these same
  structural properties influence which sites and conformations are available
  for interaction. This perspective examines how ensemble-aware RNA structure
  analysis can make such effects explicit before an experiment is run. Using
  examples from mRNA design, target accessibility, cotranscriptional folding
  and modified nucleotides, it discusses both the value and the limitations of
  thermodynamic structure models. Structural analysis does not predict
  therapeutic efficacy, but it can reveal relevant differences between
  variants, make design assumptions explicit and help formulate experimentally
  testable hypotheses.

description: >-
  How ensemble-aware RNA structure analysis reveals structural consequences of
  sequence choices before experimental testing.

summary: >-
  Whether RNA is the therapeutic molecule or the therapeutic target, structural
  effects are often hidden behind a sequence-level view. Ensemble-aware RNA
  structure analysis can reveal these effects and help turn them into
  experimentally testable hypotheses.

