# Merge Dependabot's minor/patch updates once the build workflow has passed on them.
#
# Runs after "Build and deploy" completes for a pull request. A merge made with the
# workflow token does not trigger other workflows, so the deploy is dispatched explicitly.
# Needs "Allow auto-merge" off and nothing else: the merge is a plain squash merge.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --author 'app/dependabot' --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Classify the update
        if: steps.pr.outputs.number != ''
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dependabot's commit messages carry a YAML block with one "update-type:" per dependency.
          types=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[].messageBody' | grep -oE 'update-type: "?version-update:semver-[a-z]+' | sed 's/.*semver-//; s/"//' | sort -u)
          echo "types: $types"
          if [ -n "$types" ] && ! echo "$types" | grep -qx major; then echo "safe=true" >> "$GITHUB_OUTPUT"; else echo "safe=false" >> "$GITHUB_OUTPUT"; fi

      - name: Merge minor and patch updates
        if: steps.pr.outputs.number != '' && steps.meta.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          # the merge above is made by the workflow token, which does not trigger the deploy
          gh workflow run build-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
