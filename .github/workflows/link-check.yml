# Monthly check of every outbound link in the built site. Broken links are reported in a
# single GitHub issue that is updated on each run and closed when everything resolves.
name: Outbound link check

on:
  schedule:
    - cron: "17 6 1 * *"   # first day of the month, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,test]"
      - name: Check links
        id: check
        run: |
          set +e
          CHECK_EXTERNAL_LINKS=1 python -m pytest -q tests/test_external_links.py -s 2>&1 | tee link-check.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Report in an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken outbound links"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            {
              echo "The monthly link check found outbound links that no longer resolve (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo
              echo '```'
              grep -E 'checked|BROKEN' link-check.log
              echo '```'
              echo
              echo "Links reported as *blocked* (403/429) are publishers refusing scripted requests and are not listed here."
            } > body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still broken as of $(date -u +%Y-%m-%d); details updated in the description."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "All outbound links resolve again ($(date -u +%Y-%m-%d))."
          fi
