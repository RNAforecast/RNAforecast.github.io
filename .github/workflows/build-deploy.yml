# Build the Pelican site and publish it to GitHub Pages.
#
# The build runs on every push and pull request; only pushes to main deploy.
# A build that fails, emits a Pelican warning, or trips scripts/check_build.py
# never reaches the deploy job.
name: Build and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Do not cancel a run in progress — it may be
# midway through publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The Nu Html Checker that html5validator wraps is a Java program.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: pip install -e ".[dev,test]"

      - name: Test
        run: make test

      # `make check` builds with publishconf (absolute URLs, analytics,
      # consent banner) under --fatal warnings, then smoke-tests output/.
      - name: Build and check
        run: make check

      - name: Validate markup
        run: make validate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    # Pull requests build and check, but never publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
